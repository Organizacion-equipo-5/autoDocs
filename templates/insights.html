<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Insights — AutoDocs AI</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=Geist:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f1f5f9; --surface: #ffffff; --surface-2: #f8fafc; --border: rgba(100,116,139,.25);
            --text: #0f172a; --muted: #475569; --primary: #0284c7; --secondary: #4f46e5;
            --good: #166534; --good-bg: #dcfce7; --warn: #854d0e; --warn-bg: #fef9c3;
            --orange: #9a3412; --orange-bg: #ffedd5; --bad: #b91c1c; --bad-bg: #fee2e2;
            --code-bg: #e2e8f0;
        }
        html.dark {
            --bg: #0f1418; --surface: #151c22; --surface-2: #1b242c; --border: rgba(255,255,255,.1);
            --text: #e2e8f0; --muted: #94a3b8; --primary: #38bdf8; --secondary: #818cf8;
            --good: #4ade80; --good-bg: #14532d; --warn: #fbbf24; --warn-bg: #713f12;
            --orange: #fdba74; --orange-bg: #7c2d12; --bad: #fca5a5; --bad-bg: #7f1d1d;
            --code-bg: #0f1418;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Geist', system-ui, sans-serif; line-height: 1.5; }
        code, pre, .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
        a { color: var(--primary); text-decoration: none; }
        a:hover { text-decoration: underline; }
        :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
        .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 64px; }
        .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
        .icon-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 12px; padding: 8px 12px; cursor: pointer; font: inherit; display: inline-flex; align-items: center; gap: 6px; }
        .icon-btn .material-symbols-outlined { font-size: 18px; }
        h1 { font-size: 1.6rem; margin: 0 0 4px; }
        .sub { color: var(--muted); font-size: .9rem; margin: 0 0 20px; }
        .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 24px; overflow-x: auto; }
        .tab { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 10px 16px; cursor: pointer; font: inherit; font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
        .tab[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); }
        .panel[hidden] { display: none; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 18px; }
        .card h2 { font-size: 1.05rem; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
        .card h2 .material-symbols-outlined { font-size: 20px; color: var(--primary); }
        .card .hint { color: var(--muted); font-size: .82rem; margin: 0 0 14px; }
        .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 18px; }
        .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 2px; }
        .tile .material-symbols-outlined { font-size: 18px; color: var(--muted); }
        .tile .n { font-size: 1.7rem; font-weight: 700; line-height: 1.1; }
        .tile .l { color: var(--muted); font-size: .8rem; }
        .tile.good { background: color-mix(in srgb, var(--good-bg) 55%, var(--surface)); }
        .tile.warn { background: color-mix(in srgb, var(--warn-bg) 55%, var(--surface)); }
        .tile.bad { background: color-mix(in srgb, var(--bad-bg) 45%, var(--surface)); }
        .tile.good .n, .tile.good .material-symbols-outlined { color: var(--good); }
        .tile.warn .n, .tile.warn .material-symbols-outlined { color: var(--warn); }
        .tile.bad .n, .tile.bad .material-symbols-outlined { color: var(--bad); }
        .verdict { display: flex; gap: 16px; align-items: center; border-radius: 16px; padding: 16px 18px; margin-bottom: 18px; border: 1px solid var(--border); background: var(--surface); }
        .verdict h2 { margin: 0 0 4px; font-size: 1.15rem; }
        .verdict p { margin: 0; color: var(--muted); font-size: .9rem; }
        .verdict.good { border-color: color-mix(in srgb, var(--good) 45%, var(--border)); }
        .verdict.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--border)); }
        .verdict.bad { border-color: color-mix(in srgb, var(--bad) 45%, var(--border)); }
        .ring { --p: 0; width: 84px; height: 84px; border-radius: 50%; flex: none; display: grid; place-items: center;
            background: conic-gradient(var(--ring, var(--primary)) calc(var(--p) * 1%), var(--border) 0); }
        .ring span { width: 64px; height: 64px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 1.15rem; }
        .muted { color: var(--muted); }
        .empty { color: var(--muted); padding: 24px; text-align: center; border: 1px dashed var(--border); border-radius: 14px; }
        .err { color: var(--bad); }
        .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
        .toolbar input, .controls select { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font: inherit; }
        .toolbar input { flex: 1; min-width: 160px; }
        .filters { display: flex; gap: 6px; flex-wrap: wrap; }
        .filter { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 999px; padding: 5px 10px; font: inherit; font-size: .78rem; cursor: pointer; }
        .filter[aria-pressed="true"] { background: var(--primary); color: #00131c; border-color: transparent; font-weight: 700; }
        .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); margin-bottom: 12px; }
        .legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
        .legend .lv-bajo::before { background: var(--good); }
        .legend .lv-medio::before { background: var(--warn); }
        .legend .lv-alto::before { background: var(--orange); }
        .legend .lv-crítico::before { background: var(--bad); }
        .heat { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 8px; }
        .cell { border: 1px solid transparent; border-radius: 10px; padding: 8px 10px; text-align: left; cursor: pointer; font: inherit; color: inherit; min-height: 72px; }
        .cell[hidden] { display: none; }
        .cell .s { font-weight: 700; font-size: 1.05rem; }
        .cell .name { font-size: .78rem; font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cell .dir { font-size: .68rem; opacity: .8; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cell .lv { font-size: .68rem; text-transform: uppercase; letter-spacing: .04em; opacity: .85; }
        .lv-bajo { background: var(--good-bg); color: var(--good); }
        .lv-medio { background: var(--warn-bg); color: var(--warn); }
        .lv-alto { background: var(--orange-bg); color: var(--orange); }
        .lv-crítico { background: var(--bad-bg); color: var(--bad); }
        .cell[aria-pressed="true"] { border-color: var(--text); }
        .detail { margin-top: 14px; padding: 12px 14px; background: var(--surface-2); border-radius: 12px; font-size: .9rem; }
        .bar { height: 8px; border-radius: 999px; background: var(--border); overflow: hidden; margin: 8px 0; }
        .bar i { display: block; height: 100%; border-radius: inherit; background: var(--primary); }
        table { width: 100%; border-collapse: collapse; font-size: .88rem; }
        th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
        th { color: var(--muted); font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .03em; }
        td.num, th.num { text-align: right; }
        tr[hidden] { display: none; }
        .table-scroll { overflow-x: auto; }
        .reason { display: block; color: var(--muted); font-size: .75rem; margin-top: 2px; font-family: 'Geist', system-ui, sans-serif; }
        pre { background: var(--code-bg); border-radius: 10px; padding: 10px 12px; overflow-x: auto; font-size: .78rem; margin: 8px 0 0; }
        .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .72rem; font-weight: 600; }
        .pill.good { background: var(--good-bg); color: var(--good); }
        .pill.warn { background: var(--warn-bg); color: var(--warn); }
        .pill.bad { background: var(--bad-bg); color: var(--bad); }
        .pill.neutral { background: var(--code-bg); color: var(--muted); }
        .split { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
        .split .card { margin-bottom: 0; }
        .dup { border-top: 1px solid var(--border); padding: 10px 0; }
        .dup:first-of-type { border-top: 0; padding-top: 0; }
        .dup summary { cursor: pointer; font-weight: 600; }
        .dup summary .muted { font-weight: 400; }
        .controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; margin-bottom: 14px; }
        .controls label { display: flex; flex-direction: column; gap: 4px; font-size: .78rem; color: var(--muted); flex: 1; min-width: 200px; }
        .btn { background: var(--primary); color: #00131c; border: 0; border-radius: 10px; padding: 9px 16px; font: inherit; font-weight: 700; cursor: pointer; }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .chart { width: 100%; height: auto; display: block; }
        .chart text { fill: var(--muted); font-size: 11px; font-family: 'Geist', sans-serif; }
        .chart .grid { stroke: var(--border); stroke-width: 1; }
        .chart .area { fill: var(--primary); opacity: .18; }
        .chart .line { fill: none; stroke: var(--primary); stroke-width: 2.5; }
        .chart .pt { fill: var(--surface-2); stroke: var(--primary); stroke-width: 2; cursor: pointer; }
        .chart .pt.sel { fill: var(--primary); }
        .chart .pt.from { fill: var(--secondary); stroke: var(--secondary); }
        .delta-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .delta { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px; min-width: 120px; }
        .delta b { display: block; font-size: 1.05rem; }
        .delta span { color: var(--muted); font-size: .75rem; }
        .score-hero { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
        .score-hero .big { font-size: 2.2rem; font-weight: 700; }
        .changes { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
        .change-card { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
        .change-card h3 { font-size: .92rem; margin: 0 0 8px; }
        .change-card h3 + h3 { margin-top: 12px; }
        ul.list { margin: 0; padding-left: 18px; font-size: .86rem; }
        ul.list li { margin-bottom: 4px; word-break: break-word; }
        .activity-list { display: grid; gap: 10px; }
        .activity-item { border-left: 3px solid var(--primary); background: var(--surface-2); border-radius: 0 12px 12px 0; padding: 12px 14px; }
        .activity-item h3 { margin: 0 0 4px; font-size: .92rem; }
        .activity-item p { margin: 0 0 6px; overflow-wrap: anywhere; }
        .activity-meta { color: var(--muted); font-size: .78rem; display: flex; gap: 8px 14px; flex-wrap: wrap; }
        @media (max-width: 860px) { .split { grid-template-columns: 1fr; } .verdict { align-items: flex-start; } }
        @media (prefers-reduced-motion: no-preference) { .cell, .filter, .btn { transition: transform .1s; } .cell:hover, .filter:hover { transform: translateY(-1px); } }
    </style>
</head>
<body>
<div class="wrap">
    <header class="topbar">
        <a href="#" id="back-link" class="icon-btn"><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span> Volver al análisis</a>
        <button id="themeButton" class="icon-btn" aria-label="Cambiar tema"><span id="themeIcon" class="material-symbols-outlined" aria-hidden="true">light_mode</span></button>
    </header>

    <h1 id="proj-title">Insights del proyecto</h1>
    <p class="sub">Salud del código y comparación entre análisis. Para preguntar sobre la documentación, usa el chat del análisis.</p>

    <div class="tabs" role="tablist" aria-label="Secciones">
        <button class="tab" role="tab" id="tab-health" aria-controls="panel-health" aria-selected="true" data-tab="health"><span class="material-symbols-outlined" aria-hidden="true">monitor_heart</span> Salud del código</button>
        <button class="tab" role="tab" id="tab-compare" aria-controls="panel-compare" aria-selected="false" data-tab="compare"><span class="material-symbols-outlined" aria-hidden="true">compare_arrows</span> Comparar versiones</button>
        <button class="tab" role="tab" id="tab-activity" aria-controls="panel-activity" aria-selected="false" data-tab="activity"><span class="material-symbols-outlined" aria-hidden="true">timeline</span> Actividad GitHub</button>
    </div>

    <section class="panel" id="panel-health" role="tabpanel" aria-labelledby="tab-health">
        <div id="health-body"><div class="empty">Cargando…</div></div>
    </section>

    <section class="panel" id="panel-compare" role="tabpanel" aria-labelledby="tab-compare" hidden>
        <div id="compare-body"><div class="empty">Cargando…</div></div>
    </section>

    <section class="panel" id="panel-activity" role="tabpanel" aria-labelledby="tab-activity" hidden>
        <div id="activity-body"><div class="empty">Cargando…</div></div>
    </section>
</div>

<script>
(function () {
    'use strict';
    const token = localStorage.getItem('token');
    if (!token) { window.location.href = '/'; return; }
    const projectId = {{ project_id|tojson }};
    const API = '/api/insights/' + encodeURIComponent(projectId);
    const authHeaders = () => ({ 'Authorization': 'Bearer ' + token });

    document.getElementById('back-link').href = '/analysis/' + encodeURIComponent(projectId);

    const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmtDate = (iso) => { try { return new Date(iso).toLocaleString('es-MX', { dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { return iso || ''; } };
    const fmtNum = (n) => (n == null ? '—' : (Number.isInteger(n) ? String(n) : String(Math.round(n * 100) / 100)));
    const signed = (d) => (d == null ? '—' : (d > 0 ? '+' : '') + fmtNum(d));
    async function api(path, opts) {
        const res = await fetch(API + path, Object.assign({ headers: authHeaders() }, opts || {}));
        if (res.status === 401) { window.location.href = '/'; throw new Error('Sesión expirada'); }
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || ('Error ' + res.status));
        return data;
    }
    const empty = (msg) => '<div class="empty">' + esc(msg) + '</div>';
    const fileParts = (file) => {
        const parts = String(file || '').split('/');
        return { name: parts.pop() || file, dir: parts.join('/') };
    };

    const loaded = {};
    function showTab(name) {
        if (name !== 'health' && name !== 'compare' && name !== 'activity') name = 'health';
        document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.tab === name)));
        document.querySelectorAll('.panel').forEach((p) => { p.hidden = p.id !== 'panel-' + name; });
        if (!loaded[name]) { loaded[name] = true; ({ health: loadHealth, compare: loadCompare, activity: loadActivity })[name](); }
        try { history.replaceState(null, '', '#' + name); } catch (e) { /* ignorar */ }
    }
    document.querySelectorAll('.tab').forEach((t) => {
        t.addEventListener('click', () => showTab(t.dataset.tab));
        t.addEventListener('keydown', (ev) => {
            const tabs = Array.from(document.querySelectorAll('.tab'));
            const i = tabs.indexOf(t);
            const next = ev.key === 'ArrowRight' ? tabs[(i + 1) % tabs.length] : ev.key === 'ArrowLeft' ? tabs[(i - 1 + tabs.length) % tabs.length] : null;
            if (next) { ev.preventDefault(); next.focus(); showTab(next.dataset.tab); }
        });
    });

    fetch('/api/projects/' + encodeURIComponent(projectId), { headers: authHeaders() })
        .then((r) => (r.ok ? r.json() : null))
        .then((p) => { if (p && p.name) document.getElementById('proj-title').textContent = p.name + ' — Insights'; })
        .catch(() => {});

    const LEVELS = [['bajo', '0–24'], ['medio', '25–49'], ['alto', '50–74'], ['crítico', '75–100']];

    function countTone(n, warnAt, badAt) {
        const v = Number(n) || 0;
        if (v >= badAt) return 'bad';
        if (v >= warnAt) return 'warn';
        return 'good';
    }

    async function loadHealth() {
        const box = document.getElementById('health-body');
        try {
            const data = await api('/health');
            if (!data.available) { box.innerHTML = empty(data.reason || 'Sin datos todavía.'); return; }
            renderHealth(box, data.health, data.quality_score);
        } catch (e) { box.innerHTML = '<div class="empty err">' + esc(e.message) + '</div>'; }
    }

    async function loadActivity() {
        const box = document.getElementById('activity-body');
        try {
            const data = await api('/activity');
            const activities = data.activities || [];
            if (!activities.length) {
                box.innerHTML = empty('Aún no hay actividad de GitHub. Configura el webhook del repositorio para registrar commits y ramas.');
                return;
            }
            const statusText = {
                pending: 'Análisis en espera',
                analyzing: 'Analizando',
                completed: 'Análisis completado',
                error: 'Error en el análisis',
                recorded: 'Registrado'
            };
            const items = activities.map((item) => {
                const isBranch = item.kind === 'branch';
                const title = isBranch ? 'Rama creada' : 'Commit';
                const status = statusText[item.status] || 'Registrado';
                const shortSha = item.sha ? String(item.sha).slice(0, 7) : '';
                const safeUrl = typeof item.url === 'string' && /^https:\/\/github\.com\//i.test(item.url)
                    ? item.url : '';
                return '<article class="activity-item"><h3>' + esc(title) + ': ' + esc(item.branch || 'rama desconocida') + '</h3>'
                    + (item.message ? '<p>' + esc(item.message) + '</p>' : '')
                    + '<div class="activity-meta"><span>' + esc(fmtDate(item.occurred_at || item.received_at)) + '</span>'
                    + (item.author ? '<span>Por ' + esc(item.author) + '</span>' : '')
                    + (shortSha ? '<span>' + (safeUrl ? '<a href="' + esc(safeUrl) + '" target="_blank" rel="noopener noreferrer">' : '')
                        + '<code>' + esc(shortSha) + '</code>' + (safeUrl ? '</a>' : '') + '</span>' : '')
                    + '<span>' + esc(status) + '</span></div>'
                    + (item.error ? '<p class="err" style="margin-top:6px">' + esc(item.error) + '</p>' : '')
                    + '</article>';
            }).join('');
            box.innerHTML = '<div class="card"><h2><span class="material-symbols-outlined" aria-hidden="true">timeline</span> Actividad del repositorio</h2>'
                + '<p class="hint">Se muestran hasta 100 eventos recientes. Cada push o rama nueva inicia un análisis automático.</p>'
                + '<div class="activity-list">' + items + '</div></div>';
        } catch (e) {
            box.innerHTML = '<div class="empty err">' + esc(e.message) + '</div>';
        }
    }

    function renderHealth(box, h, quality) {
        const s = h.summary || {};
        const heat = (h.heatmap && h.heatmap.files) || [];
        const dead = (h.dead_code && h.dead_code.items) || [];
        const dups = (h.duplicates && h.duplicates.items) || [];
        const hot = Number(s.hot_files) || 0;
        const avg = Number(s.avg_heat) || 0;
        let tone = 'good';
        let title = 'El código se ve estable';
        let text = 'No hay archivos en zona alta ni bloques duplicados destacados. Revisa igual los casos de código muerto antes de borrar nada.';
        if (hot >= 5 || avg >= 60) {
            tone = 'bad';
            title = 'Hay zonas que conviene atender primero';
            text = 'Varios archivos concentran complejidad alta. Empieza por los de nivel crítico o alto del mapa de calor.';
        } else if (hot || avg >= 30 || s.dead_code || s.duplicate_groups) {
            tone = 'warn';
            title = 'Hay hallazgos para revisar';
            text = 'El proyecto tiene complejidad, código sin uso o bloques repetidos. El detalle de cada sección está abajo.';
        }
        const ringValue = quality == null ? Math.round(100 - avg) : Math.round(Number(quality) || 0);
        const ringLabel = quality == null ? 'estabilidad' : 'calidad';

        const tile = (n, label, icon, tileTone) =>
            '<div class="tile ' + tileTone + '"><span class="material-symbols-outlined" aria-hidden="true">' + icon + '</span>'
            + '<div class="n">' + esc(fmtNum(n)) + '</div><div class="l">' + esc(label) + '</div></div>';

        let html = '<div class="verdict ' + tone + '"><div class="ring" style="--p:' + ringValue + ';--ring:' + (tone === 'bad' ? 'var(--bad)' : tone === 'warn' ? 'var(--warn)' : 'var(--good)') + '"><span>' + esc(ringValue) + '</span></div><div><h2>' + esc(title) + '</h2><p>' + esc(text) + ' Indicador de ' + ringLabel + ': ' + esc(ringValue) + '/100.</p></div></div>';
        html += '<div class="tiles">'
            + tile(s.dead_code, 'Posible código muerto', 'delete', countTone(s.dead_code, 1, 8))
            + tile(s.duplicate_groups, 'Bloques duplicados', 'content_copy', countTone(s.duplicate_groups, 1, 6))
            + tile(s.duplicated_lines, 'Líneas duplicadas', 'format_list_numbered', countTone(s.duplicated_lines, 1, 80))
            + tile(s.hot_files, 'Archivos en zona alta', 'local_fire_department', countTone(s.hot_files, 1, 4))
            + tile(s.avg_heat, 'Riesgo promedio', 'thermostat', countTone(s.avg_heat, 25, 50))
            + '</div>';

        const counts = { bajo: 0, medio: 0, alto: 0, 'crítico': 0 };
        heat.forEach((e) => { if (counts[e.level] != null) counts[e.level] += 1; });
        html += '<div class="card"><h2><span class="material-symbols-outlined" aria-hidden="true">grid_view</span> Mapa de calor de complejidad</h2>'
            + '<p class="hint">El número es el riesgo del archivo, de 0 a 100. Elige uno para ver lenguaje, tamaño y complejidad.</p>'
            + '<div class="legend">' + LEVELS.map(([l, r]) => '<span class="lv-' + l + '">' + esc(l) + ' ' + counts[l] + ' · ' + r + '</span>').join('') + '</div>'
            + '<div class="toolbar"><input id="heat-search" type="search" placeholder="Buscar archivo…" aria-label="Buscar archivo">'
            + '<div class="filters" id="heat-filters">'
            + '<button type="button" class="filter" data-level="todos" aria-pressed="true">Todos (' + heat.length + ')</button>'
            + LEVELS.map(([l]) => '<button type="button" class="filter" data-level="' + l + '" aria-pressed="false">' + esc(l) + ' (' + counts[l] + ')</button>').join('')
            + '</div></div>';
        if (!heat.length) html += empty('No hay archivos de código para mostrar.');
        else {
            html += '<div class="heat" id="heat-grid">' + heat.map((e, i) => {
                const p = fileParts(e.file);
                return '<button type="button" class="cell lv-' + esc(e.level) + '" data-i="' + i + '" data-level="' + esc(e.level) + '" data-file="' + esc(String(e.file).toLowerCase()) + '" aria-pressed="false" title="' + esc(e.file) + '">'
                    + '<span class="s">' + esc(e.score) + '</span> <span class="lv">' + esc(e.level) + '</span>'
                    + '<span class="name">' + esc(p.name) + '</span>'
                    + (p.dir ? '<span class="dir">' + esc(p.dir) + '</span>' : '')
                    + '</button>';
            }).join('') + '</div>'
                + '<div class="empty" id="heat-none" hidden>Ningún archivo coincide con el filtro.</div>'
                + '<div class="detail" id="heat-detail">Selecciona un archivo para ver el detalle.</div>';
            if (h.heatmap.total_files > heat.length) html += '<p class="muted" style="font-size:.8rem">Mostrando los ' + heat.length + ' archivos más complejos de ' + h.heatmap.total_files + '.</p>';
        }
        html += '</div>';

        html += '<div class="split">';
        html += '<div class="card"><h2><span class="material-symbols-outlined" aria-hidden="true">delete</span> Posible código muerto</h2>'
            + '<p class="hint">Son nombres que no aparecen en ningún otro lugar. Confirma cada caso antes de eliminarlo.</p>';
        if (!dead.length) html += empty('No se detectó código sin uso.');
        else {
            html += '<div class="toolbar"><input id="dead-search" type="search" placeholder="Buscar nombre o archivo…" aria-label="Buscar código muerto"></div>'
                + '<div class="table-scroll"><table><thead><tr><th>Nombre</th><th>Tipo</th><th>Ubicación</th><th>Confianza</th></tr></thead><tbody id="dead-rows">'
                + dead.map((d) => '<tr data-q="' + esc((d.name + ' ' + d.file + ' ' + d.kind).toLowerCase()) + '"><td><code>' + esc(d.name) + '</code>'
                    + (d.reason ? '<span class="reason">' + esc(d.reason.replace(/`/g, '')) + '</span>' : '') + '</td><td>' + esc(d.kind) + '</td><td class="mono">' + esc(d.file) + ':' + esc(d.line)
                    + '</td><td><span class="pill ' + (d.confidence === 'alta' ? 'good' : 'warn') + '">' + esc(d.confidence) + '</span></td></tr>').join('')
                + '</tbody></table></div><div class="empty" id="dead-none" hidden>Ningún resultado.</div>';
            if (h.dead_code.truncated) html += '<p class="muted" style="font-size:.8rem">Se muestran los primeros ' + dead.length + ' casos.</p>';
        }
        if (h.dead_code && h.dead_code.note) html += '<p class="muted" style="font-size:.8rem;margin-bottom:0">' + esc(h.dead_code.note) + '</p>';
        html += '</div>';

        html += '<div class="card"><h2><span class="material-symbols-outlined" aria-hidden="true">content_copy</span> Código duplicado</h2>'
            + '<p class="hint">Bloques parecidos de al menos ' + esc((h.duplicates && h.duplicates.window) || 6) + ' líneas. Ábrelos para ver el fragmento.</p>';
        if (!dups.length) html += empty('No se detectaron bloques duplicados.');
        else html += dups.map((g, i) => '<details class="dup"' + (i === 0 ? ' open' : '') + '><summary>' + esc(g.lines) + ' líneas <span class="muted">en ' + esc(g.occurrences.length) + ' lugares</span></summary>'
            + '<ul class="list">' + g.occurrences.map((o) => '<li class="mono">' + esc(o.file) + ':' + esc(o.start_line) + '–' + esc(o.end_line) + '</li>').join('') + '</ul>'
            + (g.snippet ? '<pre>' + esc(g.snippet) + '</pre>' : '') + '</details>').join('');
        html += '</div></div>';
        box.innerHTML = html;

        const grid = document.getElementById('heat-grid');
        const search = document.getElementById('heat-search');
        const none = document.getElementById('heat-none');
        let level = 'todos';
        function applyHeat() {
            if (!grid) return;
            const q = (search && search.value || '').trim().toLowerCase();
            let visible = 0;
            grid.querySelectorAll('.cell').forEach((cell) => {
                const show = (level === 'todos' || cell.dataset.level === level) && (!q || cell.dataset.file.indexOf(q) !== -1);
                cell.hidden = !show;
                if (show) visible += 1;
            });
            if (none) none.hidden = visible !== 0;
        }
        if (grid) {
            grid.addEventListener('click', (ev) => {
                const btn = ev.target.closest('.cell');
                if (!btn || btn.hidden) return;
                grid.querySelectorAll('.cell').forEach((c) => c.setAttribute('aria-pressed', String(c === btn)));
                const e = heat[Number(btn.dataset.i)];
                document.getElementById('heat-detail').innerHTML = '<strong class="mono">' + esc(e.file) + '</strong>'
                    + '<div class="bar" aria-hidden="true"><i style="width:' + esc(e.score) + '%"></i></div>'
                    + 'Riesgo <strong>' + esc(e.score) + '/100</strong> (' + esc(e.level) + ') · ' + esc(e.language) + ' · ' + esc(e.loc) + ' líneas · ' + esc(e.functions) + ' funciones<br>'
                    + 'Complejidad total: ' + esc(fmtNum(e.total_complexity)) + (e.max_complexity != null ? ' · máxima en una función: ' + esc(e.max_complexity) : '')
                    + (e.source === 'estimado' ? '<br><span class="muted">Complejidad estimada contando ramas (este lenguaje no se analiza con AST).</span>' : '');
            });
        }
        if (search) search.addEventListener('input', applyHeat);
        const filters = document.getElementById('heat-filters');
        if (filters) filters.addEventListener('click', (ev) => {
            const btn = ev.target.closest('.filter');
            if (!btn) return;
            level = btn.dataset.level;
            filters.querySelectorAll('.filter').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
            applyHeat();
        });
        const deadSearch = document.getElementById('dead-search');
        if (deadSearch) deadSearch.addEventListener('input', () => {
            const q = deadSearch.value.trim().toLowerCase();
            let visible = 0;
            document.querySelectorAll('#dead-rows tr').forEach((row) => {
                const show = !q || row.dataset.q.indexOf(q) !== -1;
                row.hidden = !show;
                if (show) visible += 1;
            });
            const miss = document.getElementById('dead-none');
            if (miss) miss.hidden = visible !== 0;
        });
    }

    let snapshots = [];

    function pointDelta(points, key) {
        if (points.length < 2) return null;
        const a = points[0][key], b = points[points.length - 1][key];
        if (a == null || b == null) return null;
        return b - a;
    }

    async function loadCompare() {
        const box = document.getElementById('compare-body');
        try {
            const data = await api('/history');
            snapshots = data.snapshots || [];
            const chartCard = '<div class="card"><h2><span class="material-symbols-outlined" aria-hidden="true">show_chart</span> Evolución del score de calidad</h2>'
                + '<p class="hint">' + (snapshots.length ? esc(snapshots.length) + ' análisis guardados. El primer punto es el más antiguo.' : 'Todavía no hay análisis guardados.') + '</p>'
                + trendSummary(snapshots) + trendChart(snapshots) + '</div>';
            if (snapshots.length < 2) {
                box.innerHTML = chartCard + empty('Se necesitan al menos dos análisis para comparar. Vuelve a analizar el proyecto después de hacer cambios, o conecta el webhook de GitHub para que se analice en cada push.');
                return;
            }
            const opt = (s) => '<option value="' + esc(s.id) + '">' + esc(fmtDate(s.created_at)) + ' · ' + esc(s.label || (s.source && s.source.event) || 'manual') + ' · score ' + esc(s.quality_score) + '</option>';
            box.innerHTML = chartCard
                + '<div class="card"><h2><span class="material-symbols-outlined" aria-hidden="true">compare_arrows</span> Comparar dos análisis</h2>'
                + '<p class="hint">Si eliges el más nuevo primero, el orden se corrige solo. Un clic en la gráfica lo pone en «Hasta».</p>'
                + '<div class="controls">'
                + '<label>Desde (anterior)<select id="cmp-from">' + snapshots.map(opt).join('') + '</select></label>'
                + '<label>Hasta (nuevo)<select id="cmp-to">' + snapshots.map(opt).join('') + '</select></label>'
                + '<button class="btn" id="cmp-go" type="button">Comparar</button></div><div id="cmp-result"></div></div>';
            const from = document.getElementById('cmp-from'), to = document.getElementById('cmp-to');
            from.value = snapshots[snapshots.length - 2].id;
            to.value = snapshots[snapshots.length - 1].id;
            document.getElementById('cmp-go').addEventListener('click', runCompare);
            from.addEventListener('change', runCompare);
            to.addEventListener('change', runCompare);
            box.querySelectorAll('.pt').forEach((p) => p.addEventListener('click', () => { to.value = p.dataset.id; runCompare(); }));
            runCompare();
        } catch (e) { box.innerHTML = '<div class="empty err">' + esc(e.message) + '</div>'; }
    }

    function trendSummary(points) {
        if (points.length < 2) return '';
        const items = [
            ['Score', pointDelta(points, 'quality_score')],
            ['Funciones', pointDelta(points, 'functions')],
            ['Clases', pointDelta(points, 'classes')],
            ['Endpoints', pointDelta(points, 'endpoints')]
        ].filter(([, d]) => d != null);
        return '<div class="delta-row">' + items.map(([label, d]) =>
            '<div class="delta"><b class="' + (d > 0 ? 'good' : d < 0 ? 'bad' : '') + '" style="color:' + (d > 0 ? 'var(--good)' : d < 0 ? 'var(--bad)' : 'inherit') + '">' + esc(signed(d)) + '</b><span>' + esc(label) + ' desde el primer análisis</span></div>'
        ).join('') + '</div>';
    }

    function trendChart(points) {
        if (!points.length) return empty('Todavía no hay análisis guardados.');
        const W = 640, H = 220, L = 34, R = 14, T = 12, B = 30;
        const x = (i) => (points.length === 1 ? (L + W - R) / 2 : L + (i * (W - L - R)) / (points.length - 1));
        const y = (v) => T + (1 - Math.max(0, Math.min(100, v)) / 100) * (H - T - B);
        let svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Evolución del score de calidad: ' + points.map((p) => p.quality_score).join(', ') + '">';
        [0, 25, 50, 75, 100].forEach((v) => { svg += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>'; });
        const coords = points.map((p, i) => x(i) + ',' + y(p.quality_score)).join(' ');
        if (points.length > 1) {
            svg += '<polygon class="area" points="' + x(0) + ',' + (H - B) + ' ' + coords + ' ' + x(points.length - 1) + ',' + (H - B) + '"/>';
            svg += '<polyline class="line" points="' + coords + '"/>';
        }
        points.forEach((p, i) => {
            svg += '<circle class="pt" data-id="' + esc(p.id) + '" cx="' + x(i) + '" cy="' + y(p.quality_score) + '" r="6"><title>' + esc(fmtDate(p.created_at)) + ' — score ' + esc(p.quality_score)
                + (p.label ? ' — commit ' + esc(p.label) : '') + '</title></circle>';
        });
        svg += '<text x="' + L + '" y="' + (H - 8) + '">' + esc(fmtDate(points[0].created_at)) + '</text>';
        if (points.length > 1) svg += '<text x="' + (W - R) + '" y="' + (H - 8) + '" text-anchor="end">' + esc(fmtDate(points[points.length - 1].created_at)) + '</text>';
        return svg + '</svg>';
    }

    async function runCompare() {
        const out = document.getElementById('cmp-result');
        const from = document.getElementById('cmp-from').value, to = document.getElementById('cmp-to').value;
        if (from === to) { out.innerHTML = empty('Elige dos análisis distintos.'); return; }
        let a = snapshots.findIndex((s) => s.id === from), b = snapshots.findIndex((s) => s.id === to), f = from, t = to;
        if (a > b) { f = to; t = from; }
        out.innerHTML = empty('Comparando…');
        document.querySelectorAll('.pt').forEach((p) => {
            p.classList.toggle('sel', p.dataset.id === t);
            p.classList.toggle('from', p.dataset.id === f);
        });
        try {
            const data = await api('/compare?from=' + encodeURIComponent(f) + '&to=' + encodeURIComponent(t));
            out.innerHTML = renderDiff(data.diff);
            const filter = document.getElementById('cmp-filter');
            if (filter) filter.addEventListener('input', () => {
                const q = filter.value.trim().toLowerCase();
                out.querySelectorAll('ul.list li').forEach((li) => { li.hidden = !!(q && li.textContent.toLowerCase().indexOf(q) === -1); });
            });
        } catch (e) { out.innerHTML = '<div class="empty err">' + esc(e.message) + '</div>'; }
    }

    function deltaPill(d, lowerIsBetter) {
        if (!d) return '<span class="pill neutral">sin cambio</span>';
        const good = lowerIsBetter ? d < 0 : d > 0;
        return '<span class="pill ' + (good ? 'good' : 'bad') + '">' + esc(signed(d)) + '</span>';
    }
    const list = (items, render, limit) => items.length
        ? '<ul class="list">' + items.slice(0, limit || 12).map((i) => '<li>' + render(i) + '</li>').join('') + (items.length > (limit || 12) ? '<li class="muted">… y ' + (items.length - (limit || 12)) + ' más</li>' : '') + '</ul>'
        : '';
    const c = (t) => '<code>' + esc(t) + '</code>';
    function block(title, count, body) {
        if (!count) return '';
        return '<h3>' + esc(title) + ' (' + esc(count) + ')</h3>' + body;
    }

    function renderDiff(d) {
        const sc = d.score, fn = d.functions, cl = d.classes, ep = d.endpoints;
        let html = '<div class="score-hero"><span class="big">' + esc(fmtNum(sc.old)) + ' → ' + esc(fmtNum(sc.new)) + '</span>' + deltaPill(sc.delta, false)
            + '<span class="muted">' + esc(fmtDate(d.from.created_at)) + ' → ' + esc(fmtDate(d.to.created_at)) + '</span></div>';
        const sum = d.summary || {};
        const chips = [
            ['Funciones nuevas', sum.functions_added], ['Funciones quitadas', sum.functions_removed], ['Funciones modificadas', sum.functions_changed],
            ['Clases nuevas', sum.classes_added], ['Clases quitadas', sum.classes_removed],
            ['Endpoints nuevos', sum.endpoints_added], ['Endpoints quitados', sum.endpoints_removed]
        ].filter(([, n]) => n);
        if (chips.length) html += '<div class="delta-row">' + chips.map(([label, n]) => '<div class="delta"><b>' + esc(n) + '</b><span>' + esc(label) + '</span></div>').join('') + '</div>';
        const rows = Object.keys(d.totals).map((k) => {
            const m = d.totals[k];
            return '<tr><td>' + esc(m.label) + '</td><td class="num">' + esc(fmtNum(m.old)) + '</td><td class="num">' + esc(fmtNum(m.new)) + '</td><td class="num">' + deltaPill(m.delta, m.lower_is_better) + '</td></tr>';
        }).join('');
        html += '<div class="table-scroll" style="margin:14px 0"><table><thead><tr><th>Métrica</th><th class="num">Antes</th><th class="num">Ahora</th><th class="num">Cambio</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
        if (!d.summary.has_changes) html += empty('No hay cambios en funciones, clases, endpoints ni score entre estos análisis.');
        html += '<div class="toolbar"><input id="cmp-filter" type="search" placeholder="Filtrar funciones, clases o endpoints…" aria-label="Filtrar cambios"></div>';
        html += '<div class="changes">';
        const epHtml = block('Endpoints agregados', ep.counts.added, list(ep.added, (e) => c(e.method + ' ' + e.path) + ' <span class="muted">' + esc(e.file) + '</span>'))
            + block('Endpoints eliminados', ep.counts.removed, list(ep.removed, (e) => c(e.method + ' ' + e.path)));
        const clHtml = block('Clases agregadas', cl.counts.added, list(cl.added, (x) => c(x.name) + ' <span class="muted">' + esc(x.file) + '</span>'))
            + block('Clases eliminadas', cl.counts.removed, list(cl.removed, (x) => c(x.name) + ' <span class="muted">' + esc(x.file) + '</span>'))
            + block('Clases modificadas', cl.counts.changed, list(cl.changed, (x) => c(x.name) + ' — ' + esc(x.changes.join('; '))));
        const fnHtml = block('Funciones agregadas', fn.counts.added, list(fn.added, (f) => c(f.name) + ' <span class="muted">' + esc(f.file) + '</span>'))
            + block('Funciones eliminadas', fn.counts.removed, list(fn.removed, (f) => c(f.name) + ' <span class="muted">' + esc(f.file) + '</span>'))
            + block('Funciones modificadas', fn.counts.changed, list(fn.changed, (f) => c(f.name) + ' — ' + esc(f.changes.join('; '))))
            + block('Funciones movidas', fn.counts.moved, list(fn.moved, (m) => c(m.name) + ' <span class="muted">' + esc(m.from) + ' → ' + esc(m.to) + '</span>'));
        if (epHtml) html += '<div class="change-card">' + epHtml + '</div>';
        if (clHtml) html += '<div class="change-card">' + clHtml + '</div>';
        if (fnHtml) html += '<div class="change-card">' + fnHtml + '</div>';
        if (d.hotspots.length) html += '<div class="change-card"><h3>Archivos más complejos que cambiaron</h3>' + list(d.hotspots, (h) => c(h.file) + ': ' + esc(fmtNum(h.old)) + ' → ' + esc(fmtNum(h.new))) + '</div>';
        return html + '</div>';
    }

    const initial = (location.hash || '').replace('#', '');
    showTab(initial === 'compare' || initial === 'activity' ? initial : 'health');
    window.setInterval(() => {
        if (!document.getElementById('panel-activity').hidden) loadActivity();
    }, 15000);
})();
</script>
<script src="/static/theme.js"></script>
</body>
</html>
