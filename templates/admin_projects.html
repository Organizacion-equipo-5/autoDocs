<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Proyectos — AutoDocs AI</title>
  <style>
    :root{--bg:#040d1a;--bg2:#060f22;--surface:#0a1628;--border:#112240;--accent:#00d4ff;--text:#ccd6f6;--muted:#8892b0}
    body{background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;display:flex;margin:0}
    .sidebar{width:260px;background:var(--bg2);padding:1.5rem;position:fixed;height:100vh}
    .main{margin-left:260px;padding:2rem;flex:1}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem}
    table{width:100%;border-collapse:collapse}
    th,td{padding:.7rem;border-bottom:1px solid rgba(255,255,255,0.06);text-align:left}
    .btn{background:var(--accent);color:#001;padding:.5rem .75rem;border-radius:8px;border:none}
    .table-button{background:rgba(255,255,255,0.04);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:.35rem .6rem}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(4,13,26,0.85);align-items:center;justify-content:center}
    .modal-overlay.active{display:flex}
    .modal{background:var(--bg);border-radius:12px;padding:1rem;width:min(720px,96%)}
  </style>
</head>
<body>
  <aside class="sidebar">
    <div style="font-weight:700;margin-bottom:1rem;color:var(--text)">AutoDocs AI</div>
    <a href="/admin" style="display:block;color:var(--muted);margin-bottom:.5rem">Overview</a>
    <a href="/admin/users" style="display:block;color:var(--muted);margin-bottom:.5rem">Usuarios</a>
    <a href="/admin/projects" style="display:block;font-weight:700;color:var(--accent);margin-bottom:.5rem">Proyectos</a>
  </aside>
  <main class="main">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
        <h2 style="margin:0">Proyectos</h2>
        <button class="btn" onclick="openModal('project')">Nuevo proyecto</button>
      </div>
      <div style="overflow-x:auto">
        <table><thead><tr><th>Nombre</th><th>Owner</th><th>Lenguaje</th><th>Estado</th><th>Creado</th><th>Acciones</th></tr></thead><tbody id="table-projects"></tbody></table>
      </div>
    </div>
  </main>

  <div id="adminModal" class="modal-overlay">
    <div class="modal">
      <button style="float:right" onclick="closeModal()">✕</button>
      <h3 id="modal-title">Proyecto</h3>
      <div id="modal-content"></div>
      <div style="display:flex;justify-content:flex-end;gap:.5rem;margin-top:1rem"><button onclick="closeModal()" class="table-button">Cancelar</button><button class="btn" onclick="submitModal()">Guardar</button></div>
    </div>
  </div>

  <script>
    const token=localStorage.getItem('token'); if(!token) window.location.href='/'; const user=JSON.parse(localStorage.getItem('user')||'{}'); if(user.role!=='admin'&&user.role!=='superadmin') window.location.href='/dashboard';
    function authHeaders(){return{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'}}
    let projectsData=[]; let currentModalType=null,currentModalId=null;
    function openModal(type,item=null){currentModalType=type;currentModalId=item?item._id:null;document.getElementById('modal-title').textContent=item?'Editar proyecto':'Nuevo proyecto';const c=document.getElementById('modal-content');c.innerHTML='';c.innerHTML+=`<label>Nombre</label><input id="modal-name" value="${item?item.name:''}" />`;c.innerHTML+=`<label>User ID</label><input id="modal-user_id" value="${item?item.user_id:''}" />`;c.innerHTML+=`<label>Lenguaje</label><input id="modal-language" value="${item?item.language:''}" />`;c.innerHTML+=`<label>Estado</label><input id="modal-status" value="${item?item.status:'pending'}" />`;c.innerHTML+=`<label>Github</label><input id="modal-github" value="${item?item.github_url:''}" />`;document.getElementById('adminModal').classList.add('active')}
    function closeModal(){document.getElementById('adminModal').classList.remove('active');currentModalType=null;currentModalId=null}
    async function submitModal(){const data={name:document.getElementById('modal-name').value,user_id:document.getElementById('modal-user_id').value,language:document.getElementById('modal-language').value,status:document.getElementById('modal-status').value,github_url:document.getElementById('modal-github').value};const url=`/api/admin/projects${currentModalId?'/'+currentModalId:''}`;const method=currentModalId?'PUT':'POST';const res=await fetch(url,{method,headers:authHeaders(),body:JSON.stringify(data)});if(!res.ok){alert('Error');return;}closeModal();loadProjectsTable();}
    async function loadProjectsTable(){try{const res=await fetch('/api/admin/projects',{headers:authHeaders()});if(!res.ok) return;projectsData=await res.json();document.getElementById('table-projects').innerHTML=projectsData.map(p=>`<tr><td>${p.name}</td><td>${p.user_id}</td><td>${p.language}</td><td>${p.status}</td><td>${p.created_at?new Date(p.created_at).toLocaleDateString():'-'}</td><td><button class="table-button" onclick='openModal("project", ${JSON.stringify(p).replace(/'/g,"\\'")})'>Editar</button> <button class="table-button" onclick="deleteRecord('project','${p._id}')">Eliminar</button></td></tr>`).join('');}catch(e){console.error(e)}}
    async function deleteRecord(type,id){if(!confirm('¿Eliminar?')) return;const res=await fetch(`/api/admin/${type==='user'?'users':type==='project'?'projects':'documents'}/${id}`,{method:'DELETE',headers:authHeaders()});if(!res.ok){alert('Error');return;}loadProjectsTable();}
    loadProjectsTable();
  </script>
</body>
</html>
