<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proyectos — AutoDocs AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #040d1a; --bg2: #060f22; --surface: #0a1628; --border: #112240; --accent: #00d4ff; --accent2: #7c3aed; --accent3: #10b981; --warn: #f59e0b; --danger: #ef4444; --text: #ccd6f6; --muted: #8892b0; --white: #e6f1ff; --mono: 'JetBrains Mono', monospace; --sans: 'Inter', sans-serif; }
    body[data-theme="light"] {
      --bg: #f5f5f5;
      --bg2: #e8e8e8;
      --surface: #ffffff;
      --border: #d0d0d0;
      --accent: #2563eb;
      --accent2: #7c3aed;
      --accent3: #059669;
      --text: #1f2937;
      --muted: #6b7280;
      --white: #ffffff;
    }
    body[data-theme="light"] .logo { color: #1f2937; }
    body[data-theme="light"] .nav-item:hover { background: rgba(0,0,0,0.05); color: #1f2937; }
    body[data-theme="light"] .user-info .name { color: #1f2937; }
    body[data-theme="light"] .page-title h1 { color: #1f2937; }
    body[data-theme="light"] .search-input { color: #1f2937; }
    body[data-theme="light"] .project-row-name { color: #1f2937; }
    body[data-theme="light"] .empty-state h3 { color: #1f2937; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 16px; line-height: 1.6; display: flex; min-height: 100vh; }
    .sidebar { width: 240px; min-height: 100vh; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 1.5rem 1rem; position: fixed; top: 0; left: 0; bottom: 0; }
    .logo { font-family: var(--mono); font-size: 0.95rem; color: var(--white); padding: 0.5rem; margin-bottom: 2rem; display: flex; align-items: center; gap: 0.4rem; text-decoration: none; }
    .logo span { color: var(--accent); }
    .nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.7rem 0.8rem; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: 0.9rem; transition: all 0.15s; margin-bottom: 0.2rem; cursor: pointer; border: none; background: none; width: 100%; text-align: left; }
    .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--white); }
    .nav-item.active { background: rgba(0,212,255,0.08); color: var(--accent); }
    .sidebar-bottom { margin-top: auto; }
    .user-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem; display: flex; align-items: center; gap: 0.75rem; }
    .avatar { width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; color: var(--bg); flex-shrink: 0; }
    .user-info .name { font-size: 0.85rem; color: var(--white); }
    .user-info .plan { font-size: 0.7rem; color: var(--muted); font-family: var(--mono); }
    .main { margin-left: 240px; flex: 1; padding: 2rem 2.5rem; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
    .page-title h1 { font-size: 1.8rem; font-weight: 800; color: var(--white); }
    .page-title p { color: var(--muted); font-size: 0.9rem; margin-top: 0.2rem; }
    .btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.6rem 1.2rem; border-radius: 6px; font-family: var(--mono); font-size: 0.82rem; font-weight: 700; cursor: pointer; border: none; transition: all 0.15s; }
    .btn-primary { background: var(--accent); color: var(--bg); }
    .btn-primary:hover { background: #33dcff; }
    .search-bar { display: flex; gap: 1rem; align-items: center; margin-bottom: 1.5rem; }
    .search-input { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.65rem 1rem; color: var(--white); font-family: var(--mono); font-size: 0.85rem; outline: none; width: 300px; transition: border-color 0.2s; }
    .search-input:focus { border-color: var(--accent); }
    .filter-select { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.65rem 1rem; color: var(--text); font-family: var(--mono); font-size: 0.82rem; outline: none; cursor: pointer; }
    .projects-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .project-row { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.2rem 1.5rem; display: flex; align-items: center; gap: 1.5rem; cursor: pointer; transition: all 0.15s; }
    .project-row:hover { border-color: rgba(0,212,255,0.3); transform: translateX(4px); }
    .project-row .icon { width: 42px; height: 42px; background: rgba(0,212,255,0.06); border: 1px solid var(--border); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
    .project-info { flex: 1; }
    .project-row-name { font-size: 1rem; font-weight: 700; color: var(--white); }
    .project-row-meta { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); margin-top: 0.2rem; }
    .project-row-stats { display: flex; gap: 1.5rem; font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }
    .project-row-stats span { color: var(--text); }
    .badge { display: inline-flex; align-items: center; padding: 0.2rem 0.6rem; border-radius: 100px; font-family: var(--mono); font-size: 0.7rem; font-weight: 700; }
    .badge.completed { background: rgba(16,185,129,0.1); color: var(--accent3); border: 1px solid rgba(16,185,129,0.2); }
    .badge.analyzing { background: rgba(245,158,11,0.1); color: var(--warn); border: 1px solid rgba(245,158,11,0.2); }
    .badge.pending { background: rgba(136,146,176,0.1); color: var(--muted); border: 1px solid var(--border); }
    .badge.error { background: rgba(239,68,68,0.1); color: var(--danger); border: 1px solid rgba(239,68,68,0.2); }
    .delete-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 0.4rem; border-radius: 6px; transition: all 0.15s; font-size: 1rem; }
    .delete-btn:hover { color: var(--danger); background: rgba(239,68,68,0.1); }
    .empty-state { text-align: center; padding: 5rem 2rem; color: var(--muted); }
    .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }
    .empty-state h3 { color: var(--white); margin-bottom: 0.5rem; }
    .quality-pill { font-family: var(--mono); font-size: 0.72rem; padding: 0.2rem 0.5rem; border-radius: 4px; }
    
    /* LOADING MODAL */
    .loading-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(4, 13, 26, 0.9);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
    }
    .loading-modal.active { display: flex; }
    .loading-content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 3rem;
      text-align: center;
      animation: fadeIn 0.3s ease;
    }
    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      animation: spin 1s linear infinite;
    }
    .loading-text {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.5rem;
    }
    .loading-subtext {
      font-size: 0.9rem;
      color: var(--muted);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <aside class="sidebar">
    <a href="/" class="logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>Auto<span>Docs</span> AI</a>
    <a href="/dashboard" class="nav-item"> Dashboard</a>
    <a href="/projects" class="nav-item active"> Proyectos</a>
    <button class="nav-item" onclick="openUploadModal()">⬆ Nuevo proyecto</button>
    <a href="#" class="nav-item" onclick="logout()"> Cerrar sesión</a>
    <div class="sidebar-bottom">
      <div class="user-card">
        <div class="avatar" id="user-avatar">U</div>
        <div class="user-info"><div class="name" id="user-name">Usuario</div><div class="plan">Plan Gratuito</div></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="page-title"><h1>Proyectos</h1><p id="projects-count">Cargando...</p></div>
      <button class="btn btn-primary" onclick="openUploadModal()"> Nuevo proyecto</button>
    </div>
    <div class="search-bar">
      <input type="text" class="search-input" placeholder=" Buscar proyecto..." id="search-input" oninput="filterProjects()" />
      <select class="filter-select" id="status-filter" onchange="filterProjects()">
        <option value="">Todos los estados</option>
        <option value="completed">Completados</option>
        <option value="analyzing">Analizando</option>
        <option value="pending">Pendientes</option>
        <option value="error">Con error</option>
      </select>
    </div>
    <div class="projects-list" id="projects-list">
      <div class="empty-state"><div class="icon"></div><h3>Cargando proyectos...</h3></div>
    </div>
  </main>

  <!-- UPLOAD MODAL (reused) -->
  <div style="display:none" id="uploadModal"><!-- same as dashboard --></div>

  <!-- LOADING MODAL -->
  <div class="loading-modal" id="loadingModal">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <div class="loading-text">Analizando proyecto...</div>
      <div class="loading-subtext">Procesando código y generando documentación</div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/';
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (user.name) { document.getElementById('user-name').textContent = user.name; document.getElementById('user-avatar').textContent = user.name[0].toUpperCase(); }

    let allProjects = [];

    async function loadProjects() {
      const res = await fetch('/api/projects/', { headers: { 'Authorization': `Bearer ${token}` } });
      if (!res.ok) return;
      allProjects = await res.json();
      document.getElementById('projects-count').textContent = `${allProjects.length} proyecto${allProjects.length !== 1 ? 's' : ''}`;
      renderProjects(allProjects);
    }

    function filterProjects() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const status = document.getElementById('status-filter').value;
      const filtered = allProjects.filter(p =>
        (!q || p.name.toLowerCase().includes(q)) &&
        (!status || p.status === status)
      );
      renderProjects(filtered);
    }

    function renderProjects(projects) {
      const list = document.getElementById('projects-list');
      if (!projects.length) {
        list.innerHTML = `<div class="empty-state"><div class="icon"></div><h3>Sin proyectos</h3><p>No se encontraron proyectos con estos filtros.</p></div>`;
        return;
      }
      const labels = { completed: '✓ Completado', analyzing: '⟳ Analizando', pending: '○ Pendiente', error: '✕ Error' };
      list.innerHTML = projects.map(p => {
        const q = p.stats?.quality_score || 0;
        const qColor = q >= 70 ? '#10b981' : q >= 40 ? '#f59e0b' : '#ef4444';
        const langIcons = { Python: '🐍', JavaScript: '⚡', TypeScript: '🔷', Java: '☕', PHP: '🐘', Go: '🔵', Ruby: '💎' };
        const icon = langIcons[p.language] || '';
        return `<div class="project-row" onclick="goToProject('${p._id}')">
          <div class="icon">${icon}</div>
          <div class="project-info">
            <div class="project-row-name">${p.name}</div>
            <div class="project-row-meta">${p.language || 'Desconocido'} · ${new Date(p.created_at).toLocaleDateString('es-MX')}</div>
          </div>
          <div class="project-row-stats">
            <div>Archivos <span>${p.stats?.files || 0}</span></div>
            <div>Funciones <span>${p.stats?.functions || 0}</span></div>
            <div>Endpoints <span>${p.stats?.endpoints || 0}</span></div>
            ${p.status === 'completed' ? `<div>Calidad <span style="color:${qColor}">${q}/100</span></div>` : ''}
          </div>
          <span class="badge ${p.status}">${labels[p.status] || p.status}</span>
          <button class="delete-btn" onclick="deleteProject(event,'${p._id}')">🗑</button>
        </div>`;
      }).join('');
    }

    function goToProject(id) { 
      const modal = document.getElementById('loadingModal');
      modal.classList.add('active');
      setTimeout(() => {
        window.location.href = `/analysis/${id}`;
      }, 300);
    }

    async function deleteProject(e, id) {
      e.stopPropagation();
      if (!confirm('¿Eliminar este proyecto?')) return;
      await fetch(`/api/projects/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
      loadProjects();
    }

    function openUploadModal() { window.location.href = '/dashboard'; }
    function logout() { localStorage.clear(); window.location.href = '/'; }

    loadProjects();
  </script>
</body>
</html>
